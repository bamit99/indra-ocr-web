services:
  indra-ocr:
    build: .
    container_name: indra-ocr
    restart: unless-stopped
    ports:
      - "8310:8310"
    volumes:
      - indra-models:/data/hf
    # mem_limit removed: this Docker/crun runtime cannot set memory.max.
    # Re-add "mem_limit: 2g" on runtimes that support it.
volumes:
  indra-models: